[package]
name = "claude-transcript"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Parse Claude Code session transcripts (~/.claude/projects/**/*.jsonl): typed records, a flat event stream, resumable tailing, usage totals, and a schema-drift report for new Claude Code releases."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutchdata/claude-transcript"
keywords = ["claude", "claude-code", "transcript", "jsonl", "parser"]
categories = ["parser-implementations", "command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "claude_transcript"
path = "src/lib.rs"

[[bin]]
name = "cct"
path = "src/bin/cct.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
